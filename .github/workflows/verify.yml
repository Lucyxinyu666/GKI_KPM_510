name: Verify new kernel
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VB64: 
        run: |
          set -e
          curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/14760546541/zip" -o ak3.zip
          unzip -o -q ak3.zip -d d
          IMG=$(find d -type f -name Image | head -1)
          echo "IMG=$IMG size=$(stat -c%s "$IMG")"
          echo "=====LINUX VERSION====="
          strings -a "$IMG" | grep -m1 '^Linux version [0-9]'
          echo "=====IKCFG CONFIG====="
          echo "$VB64" | base64 -d > /tmp/vcfg.py
          python3 /tmp/vcfg.py "$IMG"
          echo "=====FEATURE STRINGS====="
          strings -a "$IMG" | grep -iE 'sukisu|nova|susfs|dynamic_manager' | sort -u | head -20
